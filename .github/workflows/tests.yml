# Ejecuta las pruebas automáticas en cada cambio de main y en cada pull request.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pruebas automáticas
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File Tests\Run-Tests.ps1